<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>合成大月巴</title>
    <style>
        :root {
            --white: #f0f0f0;
            --dark-gray: #2a2a2a;
            --mid-gray: #3a3a3e;
            --light-gray: #b0b0b4;
            --light-purple: #c4b5e0;
            --gray-purple: #9d94ab;
            --border-subtle: rgba(180, 175, 190, 0.28);
            --surface-dark: rgba(30, 30, 34, 0.88);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background: #1e1e22;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-overflow-scrolling: none;
            background-image: url('https://origin.picgo.net/2026/08/23/Snipaste_2026-04-07_12-29-51796761674a87082b.th.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .game-wrapper {
            position: relative;
            width: 100vw;
            width: 100dvw;
            max-width: 440px;
            height: 100vh;
            height: 100dvh;
            max-height: 820px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 8px;
            gap: 6px;
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 420px;
            padding: 10px 16px;
            background: rgba(40, 40, 44, 0.82);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle);
            z-index: 10;
            flex-shrink: 0;
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--white);
            font-weight: 700;
            font-size: 1.05rem;
        }
        .score-label {
            font-size: 0.75rem;
            opacity: 0.75;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--light-gray);
        }
        .score-value {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--light-purple);
            min-width: 55px;
            text-align: center;
            transition: transform 0.15s ease;
            text-shadow: 0 0 18px rgba(196, 181, 224, 0.45);
        }
        .score-value.pulse {
            animation: scorePulse 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes scorePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); color: #fff; text-shadow: 0 0 25px rgba(255, 255, 255, 0.8); }
            100% { transform: scale(1); }
        }

        .high-score-display {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--light-purple);
            font-weight: 600;
            font-size: 0.78rem;
        }
        .high-score-display .hs-label {
            opacity: 0.65;
            font-size: 0.68rem;
            letter-spacing: 0.5px;
            color: var(--light-gray);
        }
        .high-score-display .hs-value {
            font-size: 0.9rem;
            font-weight: 800;
            color: #d4c8ec;
            min-width: 36px;
            text-align: center;
        }

        .next-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--white);
            font-size: 0.82rem;
        }
        .next-preview .label {
            opacity: 0.7;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            color: var(--light-gray);
        }
        .next-icon-wrap {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(180, 170, 195, 0.12);
            border: 2px solid var(--gray-purple);
            position: relative;
            overflow: hidden;
        }
        .next-icon-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--border-subtle) inset,
                0 0 80px rgba(160, 145, 190, 0.18);
            background: rgba(24, 24, 28, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            min-height: 300px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            cursor: pointer;
            touch-action: none;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 20, 24, 0.78);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .game-over-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .game-over-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--white);
            text-shadow: 0 0 40px rgba(220, 180, 240, 0.7);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .game-over-score {
            font-size: 1.3rem;
            color: var(--light-purple);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .game-over-high-score {
            font-size: 1rem;
            color: #d4c8ec;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        .game-over-high-score.new-record {
            animation: newRecordGlow 0.8s ease-in-out infinite alternate;
        }

        .celebrate-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(20, 20, 24, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            z-index: 25;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(2px);
        }
        .celebrate-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .celebrate-title {
            font-size: 2.1rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 25px rgba(240, 184, 96, 0.9), 0 0 10px rgba(240, 184, 96, 0.7);
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 1px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 0 15px;
        }
        .celebrate-subtitle {
            font-size: 1.05rem;
            color: #f5eedc;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0,0,0,0.5);
            animation: pulseText 1.5s infinite alternate;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pulseText {
            0% { opacity: 0.4; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }
        @keyframes newRecordGlow {
            from { text-shadow: 0 0 8px rgba(196, 181, 224, 0.5); }
            to { text-shadow: 0 0 24px rgba(210, 190, 240, 0.85), 0 0 40px rgba(180, 155, 220, 0.55); }
        }

        .restart-btn {
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #b8a5d6, #9d8ac4);
            color: #fff;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 8px 30px rgba(150, 130, 190, 0.45);
            transition: all 0.3s ease;
            pointer-events: all;
        }
        .restart-btn:active {
            transform: scale(0.94);
            box-shadow: 0 4px 15px rgba(150, 130, 190, 0.35);
        }

        .hint-text-outer {
            width: 100%;
            max-width: 420px;
            text-align: center;
            color: rgba(200, 190, 215, 0.65);
            font-size: 0.72rem;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.6s ease;
            padding: 4px 0 6px;
            flex-shrink: 0;
            min-height: 22px;
        }

        /* 音效/音乐 开关按钮样式 */
        .sound-toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 30;
            font-size: 1.2rem;
            opacity: 0.25;
            cursor: pointer;
            transition: opacity 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) {
            .sound-toggle-btn:hover {
                opacity: 0.6;
            }
        }
        .sound-toggle-btn:active {
            transform: scale(0.9);
        }

        /* 排行榜按钮样式 */
        .leaderboard-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 30;
            font-size: 1.2rem;
            opacity: 0.25;
            cursor: pointer;
            transition: opacity 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) {
            .leaderboard-btn:hover {
                opacity: 0.6;
            }
        }
        .leaderboard-btn:active {
            transform: scale(0.9);
        }

        /* 语言切换按钮样式 */
        .lang-btn {
            position: absolute;
            top: 15px;
            right: 45px;
            z-index: 30;
            font-size: 1.2rem;
            opacity: 0.25;
            cursor: pointer;
            transition: opacity 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) {
            .lang-btn:hover {
                opacity: 0.6;
            }
        }
        .lang-btn:active {
            transform: scale(0.9);
        }

        /* 语言选择列表 */
        .lang-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        .lang-option {
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(60, 58, 66, 0.6);
            border: 1px solid var(--border-subtle);
            color: var(--white);
            font-size: 0.92rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .lang-option:active {
            transform: scale(0.97);
        }
        .lang-option.active {
            background: rgba(196, 181, 224, 0.22);
            border-color: var(--light-purple);
            color: var(--light-purple);
        }

        /* 排行榜面板样式 */
        .leaderboard-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 20, 24, 0.82);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .leaderboard-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .leaderboard-panel {
            width: 84%;
            max-width: 320px;
            max-height: 82%;
            display: flex;
            flex-direction: column;
            background: rgba(38, 37, 44, 0.96);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 16px 14px;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(160, 145, 190, 0.15);
            transform: translateY(12px) scale(0.97);
            transition: transform 0.3s ease;
        }
        .leaderboard-overlay.active .leaderboard-panel {
            transform: translateY(0) scale(1);
        }
        .leaderboard-title {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--light-purple);
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 0 18px rgba(196, 181, 224, 0.4);
            flex-shrink: 0;
        }
        .leaderboard-list {
            list-style: none;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 2px;
            -webkit-overflow-scrolling: touch;
        }
        .leaderboard-list::-webkit-scrollbar { width: 4px; }
        .leaderboard-list::-webkit-scrollbar-thumb { background: rgba(180, 170, 200, 0.3); border-radius: 2px; }
        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(180, 170, 195, 0.08);
            font-size: 0.9rem;
            color: var(--white);
        }
        .leaderboard-item.highlight {
            background: rgba(196, 181, 224, 0.22);
            box-shadow: 0 0 0 1px rgba(210, 195, 240, 0.5) inset, 0 0 16px rgba(180, 155, 220, 0.35);
        }
        .lb-rank {
            width: 22px;
            text-align: center;
            font-weight: 900;
            color: var(--gray-purple);
            font-size: 0.95rem;
            flex-shrink: 0;
        }
        .leaderboard-item:nth-child(1) .lb-rank { color: #f0c860; }
        .leaderboard-item:nth-child(2) .lb-rank { color: #d0d0d8; }
        .leaderboard-item:nth-child(3) .lb-rank { color: #e0a878; }
        .lb-score {
            flex: 1;
            font-weight: 800;
            color: #d4c8ec;
            text-align: right;
        }
        .lb-date {
            font-size: 0.7rem;
            color: var(--light-gray);
            opacity: 0.7;
            flex-shrink: 0;
        }
        .leaderboard-empty {
            text-align: center;
            color: var(--light-gray);
            opacity: 0.7;
            font-size: 0.85rem;
            padding: 24px 0;
        }
        .leaderboard-close-btn {
            margin-top: 14px;
            padding: 10px 0;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #b8a5d6, #9d8ac4);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(150, 130, 190, 0.4);
            flex-shrink: 0;
        }
        .leaderboard-close-btn:active { transform: scale(0.96); }

        /* 数据统计按钮 */
        .stats-btn {
            position: absolute;
            top: 15px;
            left: 47px;
            z-index: 30;
            font-size: 1.2rem;
            opacity: 0.25;
            cursor: pointer;
            transition: opacity 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) {
            .stats-btn:hover { opacity: 0.6; }
        }
        .stats-btn:active { transform: scale(0.9); }

        /* 数据统计面板 */
        .stats-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 20, 24, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .stats-overlay.active { opacity: 1; pointer-events: all; }
        .stats-panel {
            width: 88%;
            max-width: 340px;
            max-height: 86%;
            display: flex;
            flex-direction: column;
            background: rgba(38, 37, 44, 0.96);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 16px 14px;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(160, 145, 190, 0.15);
            transform: translateY(12px) scale(0.97);
            transition: transform 0.3s ease;
        }
        .stats-overlay.active .stats-panel { transform: translateY(0) scale(1); }
        .stats-scroll {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-right: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .stats-scroll::-webkit-scrollbar { width: 4px; }
        .stats-scroll::-webkit-scrollbar-thumb { background: rgba(180, 170, 200, 0.3); border-radius: 2px; }
        .stats-section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--light-purple);
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0.9;
        }
        .stats-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border-subtle); }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .stat-card {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(180, 170, 195, 0.08);
        }
        .stat-value { font-size: 1.05rem; font-weight: 900; color: #d4c8ec; }
        .stat-label { font-size: 0.68rem; color: var(--light-gray); opacity: 0.8; }

        .ach-list { display: flex; flex-direction: column; gap: 6px; }
        .ach-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 10px;
            border-radius: 10px;
            background: rgba(180, 170, 195, 0.06);
            opacity: 0.45;
        }
        .ach-item.unlocked {
            opacity: 1;
            background: rgba(196, 181, 224, 0.14);
            box-shadow: 0 0 0 1px rgba(210, 195, 240, 0.28) inset;
        }
        .ach-icon { font-size: 1.15rem; filter: grayscale(1); }
        .ach-item.unlocked .ach-icon { filter: none; }
        .ach-info { flex: 1; min-width: 0; }
        .ach-name { font-size: 0.85rem; font-weight: 800; color: var(--white); }
        .ach-desc { font-size: 0.68rem; color: var(--light-gray); opacity: 0.8; }
        .ach-badge { font-size: 0.95rem; }

        .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 96px; padding: 0 2px; }
        .bar-col {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }
        .bar-count { font-size: 0.6rem; font-weight: 700; color: #d4c8ec; }
        .bar-fill {
            width: 100%;
            min-height: 2px;
            border-radius: 4px 4px 2px 2px;
            background: linear-gradient(180deg, #c4b5e0, #8f7fc0);
            transition: height 0.4s ease;
        }
        .bar-fill.empty { background: rgba(180, 170, 195, 0.15); }
        .bar-label { font-size: 0.6rem; color: var(--light-gray); opacity: 0.75; }

        .heatmap {
            display: grid;
            grid-template-rows: repeat(7, 10px);
            grid-auto-flow: column;
            grid-auto-columns: 10px;
            gap: 3px;
            justify-content: center;
        }
        .heat-cell { width: 10px; height: 10px; border-radius: 2px; background: rgba(180, 170, 195, 0.12); }
        .heat-cell.lv1 { background: rgba(196, 181, 224, 0.35); }
        .heat-cell.lv2 { background: rgba(196, 181, 224, 0.6); }
        .heat-cell.lv3 { background: rgba(196, 181, 224, 0.85); }
        .heat-cell.lv4 { background: #c4b5e0; box-shadow: 0 0 6px rgba(196, 181, 224, 0.6); }
        .heat-legend {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
            margin-top: 8px;
            font-size: 0.6rem;
            color: var(--light-gray);
            opacity: 0.8;
        }
        .heat-legend .heat-cell { width: 9px; height: 9px; }

        /* 成就解锁提示 */
        .achievement-toast {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translate(-50%, -20px);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 14px;
            background: rgba(46, 42, 58, 0.96);
            border: 1px solid rgba(210, 195, 240, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 24px rgba(180, 155, 220, 0.35);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            white-space: nowrap;
        }
        .achievement-toast.active { opacity: 1; transform: translate(-50%, 0); }
        .achievement-toast .toast-icon { font-size: 1.5rem; }
        .achievement-toast .toast-title { font-size: 0.62rem; color: var(--light-gray); letter-spacing: 1px; }
        .achievement-toast .toast-name { font-size: 0.9rem; font-weight: 800; color: var(--light-purple); }

        @media (max-width: 380px) {
            .game-header { padding: 6px 12px; border-radius: 16px; }
            .score-value { font-size: 1.25rem; }
            .next-icon-wrap { width: 34px; height: 34px; }
            .game-over-title { font-size: 1.7rem; }
            .celebrate-title { font-size: 1.6rem; }
            .restart-btn { padding: 10px 30px; font-size: 0.95rem; }
            .hint-text-outer { font-size: 0.68rem; }
            .sound-toggle-btn { top: 12px; right: 12px; font-size: 1.1rem; }
            .leaderboard-btn { top: 12px; left: 12px; font-size: 1.1rem; }
            .stats-btn { top: 12px; left: 42px; font-size: 1.1rem; }
            .lang-btn { top: 12px; right: 42px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">

            // 首次进入时跟随系统/浏览器语言，无法识别则回退中文
            function detectLang() {
                const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
                for (const raw of list) {
                    if (!raw) continue;
                    const code = raw.toLowerCase();
                    if (code.indexOf('zh') === 0) return 'zh';
                    if (code.indexOf('ja') === 0) return 'ja';
                    if (code.indexOf('ko') === 0) return 'ko';
                    if (code.indexOf('en') === 0) return 'en';
                }
                return 'zh';
            }
            function getSavedLang() {
                try {
                    const v = localStorage.getItem(LANG_KEY);
                    if (v && I18N[v]) return v; // 用户手动选择过，优先沿用
                } catch (e) { /* localStorage 不可用时按首次进入处理 */ }
                return detectLang();
            }
            let currentLang = getSavedLang();

            function t(key, vars) {
                const dict = I18N[currentLang] || I18N.zh;
                let s = dict[key];
                if (s === undefined) s = I18N.zh[key];
                if (s === undefined) return key;
                if (vars) { for (const k in vars) s = s.split('{' + k + '}').join(vars[k]); }
                return s;
            }
            function achName(a) { return (a.name && (a.name[currentLang] || a.name.zh)) || a.id; }
            function achDesc(a) { return (a.desc && (a.desc[currentLang] || a.desc.zh)) || ''; }

            function renderLangList() {
                langList.innerHTML = '';
                for (const lang of LANGS) {
                    const opt = document.createElement('div');
                    opt.className = 'lang-option' + (lang.code === currentLang ? ' active' : '');
                    opt.textContent = lang.label;
                    opt.addEventListener('click', (e) => { e.stopPropagation(); setLanguage(lang.code); });
                    opt.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); setLanguage(lang.code); }, { passive: false });
                    langList.appendChild(opt);
                }
            }

            function applyLanguage() {
                document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : currentLang;
                document.title = t('appTitle');

                scoreLabel.textContent = t('scoreLabel');

                hintTextOuter.textContent = t('hint');

                renderLangList();
                if (leaderboardOverlay.classList.contains('active')) renderLeaderboard();
                if (statsOverlay.classList.contains('active')) renderStats();
            }

            function setLanguage(code) {
                if (!I18N[code]) return;
                currentLang = code;
                try { localStorage.setItem(LANG_KEY, code); } catch (e) {}
                applyLanguage();
                hideLangPanel();
            }

            function showLangPanel() { renderLangList(); langOverlay.classList.add('active'); }
            function hideLangPanel() { langOverlay.classList.remove('active'); }
            function toggleLangPanel(e) {
                e.stopPropagation();
                e.preventDefault();
                if (langOverlay.classList.contains('active')) hideLangPanel();
                else showLangPanel();
            }

            // 音效配置及开关控制

            const AUDIO_URL = 'https://videotourl.com/audio/1778018991962-05128d2b-0a13-4ef8-a993-c7ac5d139a17.mp3'; 
            const dropSound = new Audio(AUDIO_URL);
            dropSound.preload = 'auto'; // 提前加载音频，避免首次点击时才开始下载
            
            let isAudioMuted = false; // 音效状态变量
            let audioUnlocked = false; // 音频是否已被用户手势解锁

            // 音效按钮事件绑定，阻止冒泡防止误触释放月巴
            function toggleAudio(e) {
                e.stopPropagation();
                e.preventDefault();
                isAudioMuted = !isAudioMuted;
                soundToggleBtn.textContent = isAudioMuted ? '🔇' : '🔊';
                soundToggleBtn.style.opacity = isAudioMuted ? '0.15' : '0.25';
            }
            soundToggleBtn.addEventListener('click', toggleAudio);
            soundToggleBtn.addEventListener('touchstart', toggleAudio, { passive: false });
            soundToggleBtn.addEventListener('mousedown', (e) => e.stopPropagation());
            soundToggleBtn.addEventListener('touchend', (e) => e.stopPropagation());

            function unlockAudio() {
                if (audioUnlocked) return;
                // 在真实用户手势中播放一次再复位，向浏览器证明「可播放」，完成自动播放解锁
                dropSound.play().then(() => {
                    dropSound.pause();
                    dropSound.currentTime = 0;
                    audioUnlocked = true;
                }).catch(() => {});
            }
            // 不设 once，保证第一次真正的用户手势（而非 mousemove）能完成解锁
            ['touchstart', 'mousedown', 'keydown', 'click'].forEach(evt => document.addEventListener(evt, unlockAudio));

            function playDropSound() {
                if (isAudioMuted) return; // 如果处于静音状态，直接返回不播放
                const soundClone = dropSound.cloneNode();
                soundClone.volume = 0.8;
                soundClone.play().catch(() => {});

                if (!url) return null;
                if (!imageCache[url]) {
                    const img = new Image();
                    img.src = url;
                    imageCache[url] = img;
                }
                return imageCache[url];
            }

                for (const data of FRUIT_DATA) { if (data.imageUrl) loadImage(data.imageUrl); }
            }

            const STORAGE_KEY = 'mergeYueBaHighScore_v10';
            function getHighScore() { try { const val = localStorage.getItem(STORAGE_KEY); return val ? parseInt(val) : 0; } catch (e) { return 0; } }
            function setHighScore(val) { try { localStorage.setItem(STORAGE_KEY, val.toString()); } catch (e) {} }

            let highScore = getHighScore();
            function updateHighScoreDisplay() { highScoreDisplay.textContent = highScore; }

            // ==========================================
            // 排行榜（本地存储，保留前 10 名）
            // ==========================================
            const LEADERBOARD_KEY = 'mergeYueBaLeaderboard_v1';
            const LEADERBOARD_MAX = 10;
            let leaderboardHighlightIndex = -1;

            function getLeaderboard() {
                try {
                    const raw = localStorage.getItem(LEADERBOARD_KEY);
                    const list = raw ? JSON.parse(raw) : [];
                    return Array.isArray(list) ? list : [];
                } catch (e) { return []; }
            }
            function saveLeaderboard(list) { try { localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(list)); } catch (e) {} }

            function addScoreToLeaderboard(finalScore) {
                leaderboardHighlightIndex = -1;
                if (finalScore <= 0) return;
                const list = getLeaderboard();
                const entry = { score: finalScore, date: Date.now() };
                list.push(entry);
                list.sort((a, b) => b.score - a.score);
                const trimmed = list.slice(0, LEADERBOARD_MAX);
                saveLeaderboard(trimmed);
                leaderboardHighlightIndex = trimmed.indexOf(entry);
            }

            function formatLeaderboardDate(ts) {
                const d = new Date(ts);
                const pad = n => (n < 10 ? '0' + n : '' + n);
                return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }

            function renderLeaderboard() {
                const list = getLeaderboard();
                leaderboardList.innerHTML = '';
                if (list.length === 0) {
                    const empty = document.createElement('li');
                    empty.className = 'leaderboard-empty';
                    empty.textContent = t('lbEmpty');
                    leaderboardList.appendChild(empty);
                    return;
                }
                list.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'leaderboard-item';
                    if (index === leaderboardHighlightIndex) li.classList.add('highlight');
                    const rank = document.createElement('span');
                    rank.className = 'lb-rank';
                    rank.textContent = index + 1;
                    const date = document.createElement('span');
                    date.className = 'lb-date';
                    date.textContent = formatLeaderboardDate(item.date);
                    const scoreSpan = document.createElement('span');
                    scoreSpan.className = 'lb-score';
                    scoreSpan.textContent = item.score;
                    li.appendChild(rank);
                    li.appendChild(date);
                    li.appendChild(scoreSpan);
                    leaderboardList.appendChild(li);
                });
            }

            function pad2(n) { return n < 10 ? '0' + n : '' + n; }
            function dayKey(ts) {
                const d = new Date(ts);
                return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
            }
            function formatDuration(ms) {
                if (!ms || ms < 0) ms = 0;
                const totalSec = Math.floor(ms / 1000);
                const h = Math.floor(totalSec / 3600);
                const m = Math.floor((totalSec % 3600) / 60);
                const s = totalSec % 60;
                if (h > 0) return t('dur_hm', { h: h, m: m });
                if (m > 0) return t('dur_ms', { m: m, s: s });
                return t('dur_s', { s: s });
            }
            function formatDate(ts) {
                if (!ts) return t('none');
                const d = new Date(ts);
                return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
            }

            function recordDailyPlay() {
                const today = dayKey(Date.now());
                stats.dailyPlays[today] = (stats.dailyPlays[today] || 0) + 1;
                if (stats.lastPlayDay !== today) {
                    const y = new Date(); y.setDate(y.getDate() - 1);
                    const yesterday = dayKey(y.getTime());
                    stats.streakCount = stats.lastPlayDay === yesterday ? (stats.streakCount || 0) + 1 : 1;
                    stats.lastPlayDay = today;
                    if (stats.streakCount > stats.maxStreak) stats.maxStreak = stats.streakCount;
                }
            }

                dpr = Math.min(window.devicePixelRatio || 1, 1.75);
                canvasWidth = Math.floor(cssWidth * dpr);
                canvasHeight = Math.floor(cssHeight * dpr);
                canvas.width = canvasWidth;
                canvas.height = canvasHeight;
                canvas.style.width = cssWidth + 'px';

                wallLeft = 0;

            function randomFruitLevel() {
                const weights = [28, 25, 20, 14, 9, 3, 1, 0, 0, 0];
                const totalWeight = weights.reduce((a, b) => a + b, 0);
                let rand = Math.random() * totalWeight;
                for (let i = 0; i < weights.length; i++) {
                    rand -= weights[i];
                    if (rand <= 0) return i;
                }
                return 4;
            }

            function spawnParticles(x, y, count, color, glowColor, intensity = 1) {
                const actualCount = Math.min(Math.floor(count), 100 - particles.length);
                for (let i = 0; i < actualCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = (2 + Math.random() * 7) * intensity;
                    const life = 25 + Math.random() * 35;
                    particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - Math.random() * 4 * intensity,
                        life, maxLife: life,
                        radius: 1.5 + Math.random() * 4 * intensity,
                        color: Math.random() < 0.5 ? color : glowColor,
                        gravity: 0.06 + Math.random() * 0.08,
                    });
                }
                while (particles.length > 100) particles.shift();
            }

            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.vy += p.gravity;
                    p.life--;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }

            function drawParticles(ctx) {
                for (const p of particles) {
                    const alpha = p.life / p.maxLife;
                    const r = p.radius * alpha;
                    if (p.color.startsWith('#')) {
                        const rh = parseInt(p.color.slice(1, 3), 16);
                        const gh = parseInt(p.color.slice(3, 5), 16);
                        const bh = parseInt(p.color.slice(5, 7), 16);
                        ctx.fillStyle = `rgba(${rh},${gh},${bh},${alpha})`;
                    } else {
                        ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
                    }
                    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
                    if (alpha > 0.4) {
                        ctx.fillStyle = `rgba(255,255,255,${alpha * 0.5})`;
                        ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.5, 0, Math.PI * 2); ctx.fill();
                    }
                }
            }

            function triggerShake(intensity) { shakeAmount = Math.max(shakeAmount, intensity); }
            function updateShake() {
                if (shakeAmount > 0.01) {
                    shakeX = (Math.random() - 0.5) * shakeAmount * 2;
                    shakeY = (Math.random() - 0.5) * shakeAmount * 2;
                    shakeAmount *= 0.85;
                } else {
                    shakeX = 0; shakeY = 0; shakeAmount = 0;
                }
            }

            function tryMergeFruits() {
                let merged = false;
                let iterations = 0;
                const maxIterations = 5; 
                do {
                    merged = false;
                    const byLevel = {};
                    for (const fruit of fruits) {
                        if (!fruit.exists) continue;
                        if (fruit.level >= MAX_LEVEL) continue;
                        const lv = fruit.level;
                        if (!byLevel[lv]) byLevel[lv] = [];
                        byLevel[lv].push(fruit);
                    }
                    for (const levelKey in byLevel) {
                        const level = parseInt(levelKey);
                        const sameLevelFruits = byLevel[levelKey];
                        if (sameLevelFruits.length < 2) continue; 
                        
                        const r = sameLevelFruits[0].radius;
                        const contactThreshold = r * 2.05; 
                        let foundPair = null;
                        const n = sameLevelFruits.length;
                        
                        for (let i = 0; i < n && !foundPair; i++) {
                            const fi = sameLevelFruits[i];
                            for (let j = i + 1; j < n && !foundPair; j++) {
                                const fj = sameLevelFruits[j];
                                const dij = Math.hypot(fi.x - fj.x, fi.y - fj.y);
                                if (dij < contactThreshold) {
                                    const cx = (fi.x + fj.x) / 2;
                                    const cy = (fi.y + fj.y) / 2;
                                    foundPair = { f1: fi, f2: fj, cx, cy };
                                    break;
                                }
                            }
                        }
                        
                        if (foundPair) {
                            const { f1, f2, cx, cy } = foundPair;
                            const newLevel = level + 1;
                            const newData = FRUIT_DATA[newLevel];
                            const newRadius = newData.radius * dpr;
                            const cvx = (f1.vx + f2.vx) / 2;
                            const cvy = (f1.vy + f2.vy) / 2;
                            const clampedX = Math.max(newRadius, Math.min(canvasWidth - newRadius, cx));
                            const clampedY = Math.min(groundY - newRadius, Math.max(newRadius, cy));
                            const newFruit = {
                                id: fruitIdCounter++,
                                level: newLevel, x: clampedX, y: clampedY,
                                vx: cvx + (Math.random() - 0.5) * 1.0,
                                vy: cvy - 2.0,
                                radius: newRadius,
                                color: newData.color, glow: newData.glow,
                                name: newData.name, imageUrl: newData.imageUrl,
                                mergeCooldown: 8, 
                                age: 0,
                                exists: true,
                            };
                            f1.exists = false; f2.exists = false;
                            fruits.push(newFruit);
                            mergeChainCount++;
                            
                            // 数据记录：合成次数、等级分布、最高等级、连锁
                            stats.totalMerges++;
                            stats.levelMerges[newLevel] = (stats.levelMerges[newLevel] || 0) + 1;
                            sessionMerges++;
                            if (newLevel > stats.maxLevelMerged) stats.maxLevelMerged = newLevel;
                            if (newLevel > sessionMaxLevel) sessionMaxLevel = newLevel;
                            sessionMergedLevels[newLevel] = true;
                            if (mergeChainCount > sessionMaxCombo) sessionMaxCombo = mergeChainCount;
                            if (mergeChainCount > stats.maxCombo) stats.maxCombo = mergeChainCount;
                            
                            const particleIntensity = 1 + mergeChainCount * 0.3;
                            const particleCount = 15 + newLevel * 5 + mergeChainCount * 5;
                            spawnParticles(clampedX, clampedY, particleCount, newData.color, newData.glow, particleIntensity);
                            triggerShake(2 + newLevel * 1.5 + mergeChainCount * 0.5);
                            
                            const baseMergeScore = FRUIT_DATA[level].score * 2;
                            score += Math.floor(baseMergeScore * (1 + mergeChainCount * 0.5));
                            triggerScorePulse(); 
                            
                            if (newLevel >= MAX_LEVEL) {
                                spawnParticles(clampedX, clampedY, 60, '#e8d890', '#ffffff', 3);
                                triggerShake(15);
                                score += 4000;
                                triggerScorePulse(); 
                                showCelebration(); 
                                // 数据记录：合成大月巴次数与最快用时
                                stats.grandMerges++;
                                sessionGrandMs = Date.now() - gameStartTime;
                                if (!stats.fastestGrandMs || sessionGrandMs < stats.fastestGrandMs) stats.fastestGrandMs = sessionGrandMs;
                            }
                            merged = true;
                            
                            checkAchievements();
                            saveStats();
                            playDropSound(); 
                            break;
                        }
                    }
                    fruits = fruits.filter(f => f.exists);
                    iterations++;
                } while (merged && iterations < maxIterations);
                if (!merged && iterations === 0) mergeChainCount = Math.max(0, mergeChainCount - 1);
            }

            // 修改物理计算实现“不可交错，不可堆叠”
            function resolveFruitCollisions(fruitsArray, applyVelocity) {
                const collisionMargin = 0; 
                for (let i = 0; i < fruitsArray.length; i++) {
                    if (!fruitsArray[i].exists) continue;
                    for (let j = i + 1; j < fruitsArray.length; j++) {
                        if (!fruitsArray[j].exists) continue;
                        const f1 = fruitsArray[i];
                        const f2 = fruitsArray[j];
                        let dx = f2.x - f1.x;
                        let dy = f2.y - f1.y;
                        let dist = Math.hypot(dx, dy);
                        const minDist = f1.radius + f2.radius + collisionMargin;
                        
                        if (dist < minDist && dist > 0.0001) {
                            
                            // 【不可堆叠】：如果两者几乎完美垂直堆叠，施加细微的随机横向推力，强行让其滑落
                            if (Math.abs(dx) < 1.5) {
                                const nudge = (Math.random() > 0.5 ? 1 : -1) * 1.2;
                                f1.x -= nudge; f2.x += nudge;
                                // 重新计算偏差
                                dx = f2.x - f1.x; dy = f2.y - f1.y;
                                dist = Math.hypot(dx, dy);
                            }

                            const overlap = minDist - dist;
                            const nx = dx / dist; const ny = dy / dist;
                            const m1 = f1.radius * f1.radius; const m2 = f2.radius * f2.radius;
                            const totalMass = m1 + m2;
                            
                            // 【不可交错】：绝对且彻底地进行位置修正重排，拒绝软体式的互相穿透
                            const sep1 = overlap * (m2 / totalMass);
                            const sep2 = overlap * (m1 / totalMass);
                            f1.x -= nx * sep1; f1.y -= ny * sep1;
                            f2.x += nx * sep2; f2.y += ny * sep2;
                            
                            if (applyVelocity) {
                                const dvx = f1.vx - f2.vx; const dvy = f1.vy - f2.vy;
                                const relVel = dvx * nx + dvy * ny;
                                if (relVel > 0) {
                                    const actualRestitution = relVel < 1.0 ? 0 : FRUIT_FRUIT_RESTITUTION;
                                    const impulse = relVel * (1 + actualRestitution) / totalMass;
                                    f1.vx -= impulse * m2 * nx; f1.vy -= impulse * m2 * ny;
                                    f2.vx += impulse * m1 * nx; f2.vy += impulse * m1 * ny;
                                }
                            }
                            f1.x = Math.max(f1.radius, Math.min(canvasWidth - f1.radius, f1.x));
                            f1.y = Math.min(groundY - f1.radius, Math.max(-f1.radius * 2, f1.y));
                            f2.x = Math.max(f2.radius, Math.min(canvasWidth - f2.radius, f2.x));
                            f2.y = Math.min(groundY - f2.radius, Math.max(-f2.radius * 2, f2.y));
                        }
                    }
                }
            }

            function updatePhysics() {
                for (const fruit of fruits) {
                    if (!fruit.exists) continue;
                    fruit.age++; 
                    fruit.vy += GRAVITY; fruit.x += fruit.vx; fruit.y += fruit.vy;
                    fruit.vx *= 0.995; fruit.vy *= 0.995;
                    
                    if (fruit.x - fruit.radius < wallLeft) { fruit.x = wallLeft + fruit.radius; fruit.vx = Math.abs(fruit.vx) * WALL_RESTITUTION; }
                    if (fruit.x + fruit.radius > wallRight) { fruit.x = wallRight - fruit.radius; fruit.vx = -Math.abs(fruit.vx) * WALL_RESTITUTION; }
                    
                    if (fruit.y + fruit.radius > groundY) {
                        fruit.y = groundY - fruit.radius; 
                        const actualRestitution = Math.abs(fruit.vy) < 1.5 ? 0 : GROUND_RESTITUTION;
                        fruit.vy = -Math.abs(fruit.vy) * actualRestitution; 
                        fruit.vx *= FRICTION;
                        if (Math.abs(fruit.vy) < 0.6) fruit.vy = 0; 
                        if (Math.abs(fruit.vx) < 0.2) fruit.vx = 0;
                    }
                    if (fruit.y - fruit.radius < -fruit.radius * 2) { fruit.y = -fruit.radius * 2 + fruit.radius; fruit.vy = Math.abs(fruit.vy) * 0.3; }
                    if (fruit.mergeCooldown > 0) fruit.mergeCooldown--;
                }
                
                resolveFruitCollisions(fruits, true);
                
                // 进行 4 次严格的位置反交错修正
                for (let iter = 0; iter < 4; iter++) {
                    resolveFruitCollisions(fruits, false);
                    for (const fruit of fruits) {
                        if (!fruit.exists) continue;
                        if (fruit.x - fruit.radius < wallLeft) fruit.x = wallLeft + fruit.radius;
                        if (fruit.x + fruit.radius > wallRight) fruit.x = wallRight - fruit.radius;
                        if (fruit.y + fruit.radius > groundY) fruit.y = groundY - fruit.radius;
                    }
                }
                
                for (const fruit of fruits) {
                    if (!fruit.exists) continue;
                    if (Math.abs(fruit.vx) < 0.05) fruit.vx = 0;
                    if (Math.abs(fruit.vy) < 0.05) fruit.vy = 0;
                }
            }

            function checkGameOver() {
                if (gameOver || isCelebrating) return; 
                if (!hasFirstDrop) return;
                
                let isAnyAboveLine = false;
                for (const fruit of fruits) {
                    if (!fruit.exists) continue;
                    if (fruit.age > 45 && fruit.y - fruit.radius <= dangerLineY) {
                        isAnyAboveLine = true;
                        break;
                    }
                }
                
                if (isAnyAboveLine) {
                    dangerTimer++;
                    if (dangerTimer >= DANGER_TIMER_LIMIT) {
                        endGame(t('dangerFullMsg'));
                    }
                } else {
                    if (dangerTimer > 0) {
                        dangerTimer = Math.max(0, dangerTimer - 2); 
                    }
                }
            }

            function endGame(message) {
                gameOver = true;
                gameOverTitle.textContent = message;
                gameOverScore.textContent = t('scorePrefix') + score;
                
                let isNewRecord = false;
                if (score > highScore) { highScore = score; setHighScore(highScore); updateHighScoreDisplay(); isNewRecord = true; }
                gameOverHighScore.textContent = t('highScorePrefix') + highScore;
                if (isNewRecord) { gameOverHighScore.classList.add('new-record'); } else { gameOverHighScore.classList.remove('new-record'); }

                addScoreToLeaderboard(score);
                
                // 数据记录：局数、总分、时长、单局纪录、游玩日历与成就
                const gameDuration = gameStartTime ? Date.now() - gameStartTime : 0;
                stats.gamesPlayed++;
                stats.totalScore += score;
                stats.totalPlayTime += gameDuration;
                if (gameDuration > stats.longestGameTime) stats.longestGameTime = gameDuration;
                if (sessionMaxLevel > stats.bestSessionMaxLevel) stats.bestSessionMaxLevel = sessionMaxLevel;
                if (!stats.firstPlayDate) stats.firstPlayDate = Date.now();
                stats.lastPlayDate = Date.now();
                recordDailyPlay();
                checkAchievements();
                saveStats();
                
                gameOverOverlay.classList.add('active');
                hintTextOuter.style.opacity = '0';
                triggerShake(6);
                
                canRestart = false;
                setTimeout(() => { canRestart = true; }, 800);
                
                for (const fruit of fruits) {
                    if (fruit.exists && fruit.y < dangerLineY + 100 * dpr) { spawnParticles(fruit.x, fruit.y, 10, '#c4b5e0', '#e8ddf8', 0.8); }
                }
            }

            // 性能优化：把某一等级水果的整体外观（阴影+底色渐变+图片+描边+高光）
            // 预渲染到一张离屏画布，之后每帧只需一次 drawImage，避免逐帧重建渐变与阴影。
            function getFruitSprite(level) {
                if (spriteDpr !== dpr) { spriteCache = {}; spriteDpr = dpr; }
                const cached = spriteCache[level];
                if (cached) return cached;
                const data = FRUIT_DATA[level];
                const r = data.radius * dpr;
                const pad = Math.ceil(r * 0.4) + 2;         // 预留阴影/高光溢出空间
                const size = Math.ceil(r * 2 + pad * 2);
                const sc = document.createElement('canvas');
                sc.width = size; sc.height = size;
                const g = sc.getContext('2d');
                const cx = size / 2, cy = size / 2;
                // 与 drawFruit 完全一致的绘制顺序，保证观感不变
                g.shadowColor = 'rgba(0,0,0,0.25)'; g.shadowBlur = r * 0.18; g.shadowOffsetX = r * 0.04; g.shadowOffsetY = r * 0.07;
                const baseGrad = g.createRadialGradient(cx - r * 0.2, cy - r * 0.25, r * 0.05, cx, cy, r);
                baseGrad.addColorStop(0, 'rgba(55,52,60,0.7)'); baseGrad.addColorStop(0.6, 'rgba(40,38,45,0.88)'); baseGrad.addColorStop(1, 'rgba(28,27,33,0.96)');
                g.fillStyle = baseGrad; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
                g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetX = 0; g.shadowOffsetY = 0;
                const img = loadImage(data.imageUrl); const innerR = r * 0.93;
                if (img && img.complete && img.naturalWidth > 0) {
                    g.save(); g.beginPath(); g.arc(cx, cy, innerR, 0, Math.PI * 2); g.clip();
                    const imgSize = innerR * 2; g.drawImage(img, cx - imgSize / 2, cy - imgSize / 2, imgSize, imgSize);
                    g.restore();
                }
                g.strokeStyle = 'rgba(170,160,188,0.88)'; g.lineWidth = r * 0.07; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
                g.strokeStyle = 'rgba(190,182,206,0.6)'; g.lineWidth = r * 0.03; g.beginPath(); g.arc(cx, cy, innerR + r * 0.018, 0, Math.PI * 2); g.stroke();
                const hlGrad = g.createRadialGradient(cx - r * 0.28, cy - r * 0.32, r * 0.02, cx - r * 0.15, cy - r * 0.2, r * 0.55);
                hlGrad.addColorStop(0, 'rgba(255,255,255,0.4)'); hlGrad.addColorStop(0.5, 'rgba(255,255,255,0.1)'); hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
                g.fillStyle = hlGrad; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
                const sprite = { canvas: sc, half: size / 2 };
                // 图片未加载完成时不缓存，待加载后再生成，避免缓存了缺图的版本
                if (img && img.complete && img.naturalWidth > 0) spriteCache[level] = sprite;
                return sprite;
            }

            function drawFruit(ctx, fruit, alpha = 1) {
                const { x, y, level } = fruit;
                if (level === undefined || !FRUIT_DATA[level]) return;
                const sprite = getFruitSprite(level);
                if (alpha === 1) {
                    ctx.drawImage(sprite.canvas, x - sprite.half, y - sprite.half);
                } else {
                    ctx.save(); ctx.globalAlpha = alpha;
                    ctx.drawImage(sprite.canvas, x - sprite.half, y - sprite.half);
                    ctx.restore();
                }
            }

            function drawBackground(ctx) {
                // 性能优化：背景（渐变+点阵）只在尺寸变化时绘制一次到离屏画布，之后每帧一次 drawImage
                if (!bgCanvas) {
                    bgCanvas = document.createElement('canvas');
                    bgCanvas.width = canvasWidth; bgCanvas.height = canvasHeight;
                    bgCtx = bgCanvas.getContext('2d');
                    const bgGrad = bgCtx.createLinearGradient(0, 0, 0, canvasHeight);
                    bgGrad.addColorStop(0, 'rgba(28,27,33,0.85)'); bgGrad.addColorStop(0.5, 'rgba(32,31,38,0.9)'); bgGrad.addColorStop(1, 'rgba(24,23,29,0.92)');
                    bgCtx.fillStyle = bgGrad; bgCtx.fillRect(0, 0, canvasWidth, canvasHeight);
                    bgCtx.fillStyle = 'rgba(190,180,210,0.012)';
                    const dots = [];
                    const dotSpacing = 18 * dpr;
                    for (let dx = dotSpacing; dx < canvasWidth; dx += dotSpacing) {
                        for (let dy = dotSpacing; dy < canvasHeight; dy += dotSpacing) { dots.push(dx, dy); }
                    }
                    // 用一个 Path2D 一次性描画所有点，减少状态切换
                    const dotPath = new Path2D();
                    for (let i = 0; i < dots.length; i += 2) { dotPath.moveTo(dots[i] + 0.5 * dpr, dots[i + 1]); dotPath.arc(dots[i], dots[i + 1], 0.5 * dpr, 0, Math.PI * 2); }
                    bgCtx.fill(dotPath);
                }
                ctx.drawImage(bgCanvas, 0, 0);
            }

            function drawDangerLine(ctx) {
                const y = dangerLineY; ctx.strokeStyle = 'rgba(255,120,120,0.55)'; ctx.lineWidth = 2 * dpr; ctx.setLineDash([12 * dpr, 8 * dpr]);
                ctx.lineDashOffset = -Date.now() / 1000 * 20 * dpr; ctx.beginPath(); ctx.moveTo(10 * dpr, y); ctx.lineTo(canvasWidth - 10 * dpr, y); ctx.stroke();
                ctx.setLineDash([]); ctx.lineDashOffset = 0;
                const fontSize = 11 * dpr; ctx.fillStyle = 'rgba(255,140,140,0.6)'; ctx.font = `bold ${fontSize}px sans-serif`; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
                ctx.fillText(t('dangerLine'), canvasWidth - 14 * dpr, y - 4 * dpr);
            }

            // 性能优化：可复用的水果排序数组，避免每帧新建数组
            const _renderFruits = [];
            function render() {
                ctx.clearRect(0, 0, canvasWidth, canvasHeight); ctx.save(); if (shakeAmount > 0.01) ctx.translate(shakeX, shakeY);
                drawBackground(ctx); drawDangerLine(ctx);
                _renderFruits.length = 0;
                for (const f of fruits) { if (f.exists) _renderFruits.push(f); }
                _renderFruits.sort((a, b) => a.y - b.y);
                for (const fruit of _renderFruits) { drawFruit(ctx, fruit, 1); }
                if (previewFruit && !gameOver && !isCelebrating && releaseCooldown <= 0) {
                    const previewAlpha = 0.7 + Math.sin(Date.now() / 400) * 0.15; drawFruit(ctx, previewFruit, previewAlpha);
                    const px = previewFruit.x; const py = previewFruit.y + previewFruit.radius;
                    ctx.strokeStyle = 'rgba(190,180,210,0.3)'; ctx.lineWidth = 1.2 * dpr; ctx.setLineDash([5 * dpr, 8 * dpr]);
                    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py + 28 * dpr); ctx.stroke(); ctx.setLineDash([]);
                }
                drawParticles(ctx); ctx.restore();
                // 性能优化：顶部渐变按尺寸缓存，避免每帧重建
                let topGrad = staticGrads.top;
                if (!topGrad) {
                    topGrad = ctx.createLinearGradient(0, 0, 0, dangerLineY);
                    topGrad.addColorStop(0, 'rgba(20,20,24,0.6)'); topGrad.addColorStop(1, 'rgba(20,20,24,0)');
                    staticGrads.top = topGrad;
                }
                ctx.fillStyle = topGrad; ctx.fillRect(0, 0, canvasWidth, dangerLineY);
            }

            let lastTime = 0; let accumulator = 0; const fixedDt = 1000 / 60;

            // 性能优化：静止帧降频。物理仍按 60fps 计算，但画面静止时渲染降到约 20fps，
            // 一旦有任意物体移动/粒子/操作/动画，立即恢复 60fps，肉眼无感。
            let lastRenderTime = 0;
            let forceActiveUntil = 0; // 该时间戳之前强制全速渲染（如点击、合成庆祝）
            const IDLE_RENDER_INTERVAL = 1000 / 20;

            function isSceneActive(now) {
                if (now < forceActiveUntil) return true;
                if (shakeAmount > 0.01) return true;
                if (particles.length > 0) return true;
                if (isCelebrating || gameOver) return true;
                if (!hasFirstDrop) return true;                 // 顶部提示脉动动画
                if (previewFruit && releaseCooldown <= 0) return true; // 待释放水果的上下浮动动画
                // 任一水果仍在明显移动
                for (const f of fruits) {
                    if (!f.exists) continue;
                    if (Math.abs(f.vx) > 0.08 || Math.abs(f.vy) > 0.08) return true;
                }
                return false;
            }

            function gameLoop(timestamp) {
                if (!lastTime) lastTime = timestamp; let dt = timestamp - lastTime; lastTime = timestamp; if (dt > 100) dt = 100;
                accumulator += dt; let updates = 0;
                
                while (accumulator >= fixedDt && updates < 5) {
                    if (!gameOver) { updatePhysics(); tryMergeFruits(); checkGameOver(); if (releaseCooldown > 0) releaseCooldown--; }
                    updateParticles(); updateShake(); accumulator -= fixedDt; updates++;
                }

                if (displayedScore < score) {
                    let diff = score - displayedScore;
                    let increment = Math.ceil(diff * 0.15); 
                    if (increment < 1 && diff > 0) increment = 1;
                    displayedScore += increment;
                    scoreDisplay.textContent = displayedScore;
                    forceActiveUntil = timestamp + 300; // 分数滚动期间保持全速
                }

                if (!hasFirstDrop && !gameOver) { hintOpacity = 0.6 + Math.sin(timestamp / 1800) * 0.3; hintTextOuter.style.opacity = hintOpacity; }
                else if (hasFirstDrop && hintOpacity > 0) { hintOpacity = Math.max(0, hintOpacity - 0.015); hintTextOuter.style.opacity = hintOpacity; }

                // 周期性检测时间类成就（如单局时长），每约 1 秒一次
                if (!gameOver && timestamp - lastAchCheck > 1000) { lastAchCheck = timestamp; checkAchievements(); saveStats(); }

                // 性能优化：静止时降频渲染
                if (isSceneActive(timestamp) || timestamp - lastRenderTime >= IDLE_RENDER_INTERVAL) {
                    lastRenderTime = timestamp;
                    render();
                }
                requestAnimationFrame(gameLoop);
            }

            function getEventPos(e) {
                const rect = canvas.getBoundingClientRect(); const scaleX = canvasWidth / rect.width; const scaleY = canvasHeight / rect.height;
                let clientX, clientY;
                if (e.touches) {
                    if (e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
                    else if (e.changedTouches && e.changedTouches.length > 0) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; }
                    else { return null; }
                } else { clientX = e.clientX; clientY = e.clientY; }
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            }

            function updatePreviewPosition(pos) { if (!previewFruit || gameOver || isCelebrating) return; const r = previewFruit.radius; previewFruit.x = Math.max(r, Math.min(canvasWidth - r, pos.x)); }
            function handlePointerDown(e) { if (gameOver || isCelebrating) return; e.preventDefault(); const pos = getEventPos(e); if (pos) { updatePreviewPosition(pos); releaseFruit(); } }
            function handlePointerMove(e) { if (gameOver || isCelebrating) return; e.preventDefault(); const pos = getEventPos(e); if (pos) updatePreviewPosition(pos); }
            function handlePointerUp(e) { if (gameOver || isCelebrating) return; e.preventDefault(); if (e.changedTouches && e.changedTouches.length > 0) releaseFruit(); }

            celebrateOverlay.addEventListener('click', (e) => { e.stopPropagation(); hideCelebration(); });
            celebrateOverlay.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); hideCelebration(); }, { passive: false });

            restartBtn.addEventListener('click', (e) => { e.stopPropagation(); if(canRestart) initGame(); });
            restartBtn.addEventListener('touchend', (e) => { e.stopPropagation(); e.preventDefault(); if(canRestart) initGame(); });
            gameOverOverlay.addEventListener('click', (e) => { if (e.target === gameOverOverlay && canRestart) initGame(); });

            canvas.addEventListener('mousedown', handlePointerDown);
            canvas.addEventListener('mousemove', handlePointerMove);
            canvas.addEventListener('click', (e) => { if (gameOver || isCelebrating) return; if (!('ontouchstart' in window)) releaseFruit(); });
            canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
            canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
            canvas.addEventListener('touchend', handlePointerUp, { passive: false });
            window.addEventListener('resize', () => {
                resizeCanvas();
                for (const fruit of fruits) { if (fruit.exists) { fruit.radius = FRUIT_DATA[fruit.level].radius * dpr; fruit.x = Math.max(fruit.radius, Math.min(canvasWidth - fruit.radius, fruit.x)); fruit.y = Math.min(groundY - fruit.radius, fruit.y); } }
            });
            
            function startGame() { 
                unlockAudio(); // 点击开始时正处于用户手势中，借此机会完成音频解锁
                applyLanguage(); // 应用已保存的语言
                preloadAllImages(); 
                highScore = getHighScore(); 
                updateHighScoreDisplay(); 
                resizeCanvas(); 
                initGame(); 
                lastTime = performance.now(); 
                requestAnimationFrame(gameLoop); 
            }
            
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startGame); else startGame();
        })();
    </script>
</body>
</html>
